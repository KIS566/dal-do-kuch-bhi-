<!DOCTYPE html>
<html>

<head>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Portfolio</title>
</head>

<style>

  *{
    box-sizing:border-box;
  }
body{
  margin:0;
    padding:0;
    min-height:100vh;
    color:white;
    background-color:black;
}
  


  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:20px;
    width:90vw;
    margin:auto;
    padding-top:20px;
  }

  .head{
    display:flex;
    gap:30px;
    list-style:none;
  }

  .head li{
    cursor:pointer;
  }

  .container{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:50px 30px;
  }
  .img-cont{
    height:350px;
    width:350px;
    border-radius:50%;
    outline:2px solid orange;
    background-image:url("/love.html/Ayodhya.png");
    background-size:cover;
    background-position:center;
  }
  .big{
    font-size:60px;
    font-weight:bold;
  }
  .bigger{
    font-size:50px;
    font-weight:bold;
  }

  /* Typing text */
  #typing-text{
    color:#00ff41;
    text-shadow:
      0 0 5px #00ff41,
      0 0 10px #00ff41,
      0 0 20px #00ff41;
  }

  /* Cursor */
  #typing-text::after{
    content:"|";
    animation:blink 0.7s infinite;
  }

  @keyframes blink{
    0%,50%{
      opacity:1;
    }

    51%,100%{
      opacity:0;
    }
  }
.text-cont{
  width:650px;
}

@media (max-width: 768px) {
body{
    
    background:linear-gradient(
        -45deg,
        #000000,
        #111111,
        #1a1a1a,
        #050505,
        #000000
    );

    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}

  header {
    width: 95%;
    flex-direction: column;
    gap: 20px;
    text-align: center;
  }
  
  .head {
    gap: 18px;
    padding: 0;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 16px;
  }
  
  .container {
    flex-direction: column-reverse;
    text-align: center;
    margin: 30px 20px;
    gap: 40px;
  }
  
  .img-cont {
    width: 250px;
    height: 250px;
  }
  
  .big {
    font-size: 42px;
    line-height: 1.2;
  }
  
  .bigger {
    font-size: 28px;
  }
  
  .text-cont {
    width: 100%;
  }
}

@media (max-width:480px) {
  
  .head {
    gap: 12px;
    font-size: 14px;
  }
  
  .img-cont {
    width: 200px;
    height: 200px;
  }
  
  .big {
    font-size: 34px;
  }
  
  .bigger {
    font-size: 22px;
  }
  
  #typing-text {
    display: block;
    margin-top: 8px;
  }
}

</style>

<body>

  <header>

    <div>
      Portfolio
    </div>

    <div>
      <ul class="head">
        <li>Home</li>
        <li>About</li>
        <li>Projects</li>
        <li>Contact</li>
      </ul>
    </div>

  </header>


  <main>

    <div class="container">

      <div class="text-cont">

        <h1 class="big">
          Hey It's Me <br>
          Love Kumar
        </h1>

        <h2 class="bigger">
          I am a <span id="typing-text"></span>
        </h2>

      </div>


      <div class="img-cont"></div>

    </div>

  </main>


  <script>

    let text = document.getElementById("typing-text");
let words = [
    "Frontend Developer",
    "Backend Developer",
    "UI/UX Designer"
];
    let wordIndex = 0;
    let charIndex = 0;
    let deleting = false;


    function typeEffect(){

      let currentWord = words[wordIndex];


      // Text likhna
      if(!deleting){

        text.textContent =
          currentWord.slice(0, charIndex + 1);

        charIndex++;


        // Word complete hone ke baad wait
        if(charIndex === currentWord.length){

          deleting = true;

          setTimeout(typeEffect, 1500);

          return;
        }

      }


      // Text delete karna
      else{

        text.textContent =
          currentWord.slice(0, charIndex - 1);

        charIndex--;


        // Word delete hone ke baad next word
        if(charIndex === 0){

          deleting = false;

          wordIndex++;


          // Last word ke baad wapas first word
          if(wordIndex === words.length){

            wordIndex = 0;

          }

        }

      }


      // Typing speed
      setTimeout(
        typeEffect,
        deleting ? 80 : 120
      );

    }


    // Function start
    typeEffect();

  </script>

</body>

</html>
